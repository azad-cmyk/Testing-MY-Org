<template>

    <lightning-card title="Accounts Lazy Loading">

        <!-- OPEN BUTTON -->
        <lightning-button label="Open Accounts" variant="brand" onclick={openModal}>
        </lightning-button>

        <lightning-button label="Dynamic Metadata" variant="brand" onclick={openModalDynamic}>
        </lightning-button>

    </lightning-card>


    <!-- MODAL -->
    <template if:true={isModalOpen}>

        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- HEADER -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Accounts</h2>

                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={closeModal}
                        class="slds-modal__close">
                    </lightning-button-icon>
                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium">

                    <div style="height:400px">

                        <lightning-datatable key-field="Id" data={accounts} columns={columns} enable-infinite-loading
                            onloadmore={loadMoreData} hide-checkbox-column show-row-number-column>
                        </lightning-datatable>

                    </div>

                </div>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

    <!-- FieldModal -->
    <template if:true={isFieldModalOpen}>

        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- HEADER -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Fields</h2>

                    <lightning-button-icon icon-name="utility:close" onclick={closeFieldModal}
                        class="slds-modal__close">
                    </lightning-button-icon>
                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium">

                    <!-- SCROLL CONTAINER -->
                    <div class="field-container" onscroll={handleScroll} style=" height: 400px ;Position:relative;
                             overflow-y: auto;
                            border: 1px solid #ddd;
                            padding: 10px;">

                        <template for:each={fields} for:item="field">
                            <div key={field.apiName} class="field-row" style="padding: 8px;
    border-bottom: 1px solid #eee;
    font-size: 14px;">
                                {field.label}
                            </div>
                        </template>

                        <!-- LOADER -->
                        <template if:true={isFieldLoading}>
                            <div class="loader" style="text-align: center; position: relative;min-height:40px;
    padding: 10px;">
                                <lightning-spinner size="small"></lightning-spinner>
                            </div>
                        </template>

                    </div>

                </div>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>
