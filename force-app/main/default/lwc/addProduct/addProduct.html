<template>
    <!-- ================================
        Add Product Button
    ================================= -->
    <div class="slds-m-bottom_medium">
        <lightning-button 
            variant="brand" 
            label="Add Product" 
            onclick={handleAddProduct}>
        </lightning-button>
    </div>

    <!-- ================================
        Spinner while loading
    ================================= -->
    <template if:true={isLoading}>
        <div class="spinner-backdrop">
            <lightning-spinner
                alternative-text="Loading"
                size="medium"
                variant="brand">
            </lightning-spinner>
        </div>
    </template>


    <!-- ================================
        Add Product Modal
    ================================= -->
    <template if:true={isAddProductModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Add Products</h2>
                    <h3>Pricebook : {pricebookName}</h3>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium slds-box slds-theme_default">
                    <div class="slds-m-bottom_small">
                        <lightning-input type="text" value={searchValue} label="Search Product"
                            placeholder="Search Products..." onchange={searchKeyword}>
                        </lightning-input>
                    </div>
                    <div class="slds-m-bottom_small">
                        <template if:true={allProducts}>
                            <span class="slds-text-body_regular slds-text-color_default slds-m-bottom_medium">
                                Selected Rows ({selectedRowCount})
                            </span>
                            <lightning-datatable 
                                key-field="Id" 
                                data={filteredProducts} 
                                columns={productColumns}
                                onrowselection={handleSelectAction} 
                                selected-rows={selectedProductIdsOfAddProductModel}>
                            </lightning-datatable>
                        </template>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button variant="brand" label="Change Pricebook" title="Change Pricebook"
                        onclick={handlePricebookChange} class="slds-float_left"></lightning-button>
                    <lightning-button label="Cancel" onclick={closeModal} class="slds-m-right_small"></lightning-button>
                    <lightning-button variant="brand" label="Next" onclick={handleNext} disabled={disableNextButton}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ================================
        Edit Selected Products Modal
    ================================= -->
    <template if:true={isEditProductsModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close"  size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Edit Selected Products</h2>
                </header>

                <!-- Body -->
                <!-- <div class="slds-modal__content slds-p-bottom_large slds-scrollable_x">
                    <c-custom-picklist-data-type
                        key-field="Id"
                        data={selectedProductsOnEditProductModel}
                        columns={editableProductColumns}
                        onrowaction={handleRowAction}
                        hide-checkbox-column
                        show-row-number-column
                        suppress-bottom-bar="true"
                        draft-values={draftValues}
                        oncellchange={handleCellChange}
                    ></c-custom-picklist-data-type>  
                </div> -->

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Add Line Item" onclick={handleAddLineItem} variant="brand" class="slds-float_left"></lightning-button>
                    <lightning-button label="Cancel" onclick={closeModal} class="slds-m-right_small"></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={saveProduct} disabled={disableSaveButton}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ================================
        Choose Pricebook Modal
    ================================= -->
    <template if:true={isPricebookModelOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close"  size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="pricebook-modal-heading" class="slds-text-heading_medium slds-hyphenate">
                        Choose Pricebook
                    </h2>
                </header>

                 <!-- Body -->
                <div class="slds-modal__content slds-p-around_large">
                    <!-- <p class="slds-text-body_regular slds-m-bottom_large">
                        Select a Price Book to associate with this opportunity.
                        You can add products only from the Price Book you associate with this opportunity.
                        Changing the Price Book will delete all existing products from the opportunity.
                    </p> -->

                    <lightning-combobox
                        name="pricebook"
                        label="Pricebook"
                        value={pricebookId}
                        options={pricebookListOptions}
                        onchange={handleChangePricebook}>
                    </lightning-combobox>
                </div>

                  <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" title="Cancel" onclick={closeModal} class="slds-m-right_small"> </lightning-button>
                    <lightning-button variant="brand" label="Save" title="Save" onclick={handleSavePricebook}> </lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
